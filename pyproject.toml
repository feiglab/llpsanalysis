[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llpsanalysis"
version = "1.0.0"
description = "Code for LLPS condensate analysis"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

dependencies = [
  # Match mdsim's NumPy constraints on Python 3.9.
  "numpy>=1.23,<2.0; python_version<'3.10'",
  "numpy>=2.0; python_version>='3.10'",
  "pandas>=2.2,<3.0; python_version<'3.11'",
  "pandas>=2.2; python_version>='3.11'",
  "scipy>=1.13,<1.14; python_version<'3.10'",
  "scipy>=1.14,<1.16; python_version>='3.10' and python_version<'3.11'",
  "scipy>=1.16; python_version>='3.11'",
  "matplotlib>=3.9,<3.10; python_version<'3.10'",
  "matplotlib>=3.10; python_version>='3.10'",
  "mdtraj>=1.10.3,<1.11; python_version<'3.11'",
  "mdtraj>=1.11; python_version>='3.11'",
  "openmm>=8.0,<8.2; python_version<'3.10'",
  "openmm>=8.0; python_version>='3.10'",
  "mdsim @ git+https://github.com/feiglab/mdsim.git",
]

[project.scripts]
#example = "llpsanalysis.cli.example:main"

[tool.setuptools]
package-dir = {"" = "src"}
#script-files = [
#  "scripts/example.sh",
#]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src"]

[tool.ruff.lint]
select = ["E","F","I","UP"]
ignore = ["UP007", "UP045", "E501"]
